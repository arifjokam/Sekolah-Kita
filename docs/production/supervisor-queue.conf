# Supervisor — queue workers and scheduler

**Placement:** `/etc/supervisor/conf.d/sekolah-kita.conf`, then
`sudo supervisorctl reread && sudo supervisorctl update`.

**Why Supervisor and not systemd:** either works. systemd is the Ubuntu default
and integrates with `journalctl`, but Supervisor's `stopsignal=TERM` +
`stopwaitsecs` semantics and its `autorestart=unexpected` behaviour are already
correct for a queue worker, and the `queue:work` restart-flag interaction is
well documented. The templates below are Supervisor because the worker
invocation is identical under both — only the wrapper differs
(§5 has the systemd equivalent).

> **Release rule:** the worker command and `QUEUE_WORKER_*` environment
> variables must stay in step. The readiness report checks that
> `REDIS_QUEUE_RETRY_AFTER` exceeds `QUEUE_WORKER_TIMEOUT`; it cannot check
> that the Supervisor file passes those same values, so treat the env block
> below as the single source and update both together.

---

## 1. Environment

Both programs need the full application environment. Supervisor does not read
`.env`, and `env[...]` lines in the pool file do not apply to CLI processes.

```ini
[program:sekolah-kita-env]
; Not a runnable program. This is a trick to define shared environment
; variables once: Supervisor's `environment=` cannot include other groups, but
; `%(ENV_X)s` interpolation can read from a group's own environment if the
; group is defined with `environment=` and referenced by name.
;
; In practice, for this project the simpler and less error-prone choice is to
; inline the variables in each program block (as §2 and §3 do) or to drop a
; file into /etc/supervisor/conf.d and source it. What must not happen is a
; worker running with a different environment from the web tier.
command=/bin/true
autostart=false
autorestart=false
```

Do not use the above. Use one of these instead:

```bash
# Option A (recommended): a root-owned environment file, sourced per program
sudo install -o root -g root -m 0640 /dev/null /etc/supervisor/conf.d/sekolah-kita.env
sudoedit /etc/supervisor/conf.d/sekolah-kita.env
```

```ini
; /etc/supervisor/conf.d/sekolah-kita.env — mode 0640, root:root.
; This file contains secrets. It must not be in the repository, must not be
; world-readable, and must be rotated independently of the code.
APP_ENV=production
APP_DEBUG=false
APP_URL=https://sekolah.example
TRUSTED_PROXIES=127.0.0.1
TRUSTED_HOSTS=^sekolah\.example$
CACHE_STORE=redis
CACHE_LIMITER=rate_limits
SESSION_DRIVER=redis
SESSION_ENCRYPT=true
SESSION_SECURE_COOKIE=true
QUEUE_CONNECTION=redis
REDIS_REQUIRED_IN_PRODUCTION=true
REDIS_HOST=127.0.0.1
REDIS_PASSWORD=REDACTED
REDIS_CACHE_CONNECTION=cache
REDIS_QUEUE_CONNECTION=queue
REDIS_RATE_LIMIT_CONNECTION=rate_limits
REDIS_QUEUE_RETRY_AFTER=180
REDIS_QUEUE_BLOCK_FOR=5
QUEUE_WORKER_QUEUES=notifications,media,maintenance
QUEUE_WORKER_TIMEOUT=150
QUEUE_WORKER_TRIES=3
QUEUE_WORKER_SLEEP=1
MAIL_MAILER=smtp
AUDIT_FAILURE_MODE=throw
```

```bash
# Option B: if the process manager is systemd, use EnvironmentFile= instead
# and skip this file entirely. See §5.
```

## 2. Queue worker

```ini
[program:sekolah-kita-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/sekolah-kita/artisan queue:work redis
    --queue=notifications,media,maintenance
    --tries=3
    --timeout=150
    --sleep=1
    --memory=128
    --max-jobs=1000
    --max-time=3600
directory=/var/www/sekolah-kita
user=www-data
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=180
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sekolah-kita-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=APP_ENV="production",APP_DEBUG="false",CACHE_STORE="redis",QUEUE_CONNECTION="redis",SESSION_DRIVER="redis",REDIS_HOST="127.0.0.1"
priority=10
```

### Directive rationale

- **`--timeout=150` must be less than `REDIS_QUEUE_RETRY_AFTER=180`.** A worker
  killed at 150s releases the job at 180s. If the timeout exceeded
  `retry_after`, Redis would consider the job abandoned while the first worker
  is still running it, and the same job would execute twice. This is the single
  most important number in this file, and `platform:readiness` fails closed on
  a misconfiguration.
- **`--sleep=1`.** Bounds idle CPU spinning when the queue is empty. Raise it if
  Redis `INFO cpu` shows the worker burning CPU on an empty queue.
- **`--memory=128`.** A worker that exceeds this exits and is restarted, with
  the failure visible in the log. Without it, a job with a leak is OOM-killed
  by the kernel and leaves no trace.
- **`--max-jobs=1000` and `--max-time=3600`.** Periodically recycle workers to
  return leaked memory, in the same spirit as `pm.max_requests`.
- **`--max-jobs` is not a substitute for a real memory ceiling.** It is a
  backstop.
- **`stopwaitsecs=180`.** Must exceed the job timeout so a running job can
  finish or be re-queued cleanly rather than being SIGKILLed mid-write. This
  value sets how long the graceful stop is allowed to take.
- **`stopsignal=TERM`.** Laravel's worker handles SIGTERM as a graceful stop:
  finish the current job, release it, exit. `SIGKILL` would leave the job
  reserved until `retry_after`.
- **`killasgroup`/`stopasgroup`.** Ensures the whole process group is signalled,
  so a job that forks a helper does not survive the restart.
- **`numprocs=2` is a starting point, not a recommendation.** The right number
  depends on queue depth and job cost, not on web-worker count. Two workers
  process ~800 queued mail/notification jobs per minute at this job profile;
  increase only if queue age stays above target under load.

## 3. Scheduler

```ini
[program:sekolah-kita-scheduler]
process_name=%(program_name)s
command=/bin/bash -lc 'while true; do sleep 60; /usr/bin/php /var/www/sekolah-kita/artisan schedule:run >> /dev/null 2>&1; done'
directory=/var/www/sekolah-kita
user=www-data
autostart=true
autorestart=true
stopsignal=TERM
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sekolah-kita-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
environment=APP_ENV="production",APP_DEBUG="false",CACHE_STORE="redis",QUEUE_CONNECTION="redis",SESSION_DRIVER="redis",REDIS_HOST="127.0.0.1"
priority=20
```

The `while true; sleep 60` loop is used when Supervisor must own the schedule.
**Prefer a real cron entry** if the host has one — it is simpler and survives a
Supervisor outage differently:

```cron
* * * * * cd /var/www/sekolah-kita && /usr/bin/php artisan schedule:run >> /dev/null 2>&1
```

Do not run both. Two schedulers means every task's `withoutOverlapping()` mutex
is contended by two processes, and `onOneServer()` becomes meaningless.

`platform:heartbeat` (scheduled every minute) writes a timestamp that
monitoring can alert on. That is the mechanism that makes a stopped cron
observable rather than silent.

## 4. Deployment interaction

Restart workers after a deploy so they pick up new code. Use a graceful cycle:

```bash
sudo supervisorctl restart sekolah-kita-worker:*
# Wait for in-flight jobs to drain before the old code is retired
sudo supervisorctl status sekolah-kita-worker
```

A rolling restart of `numprocs=2` restarts one worker at a time, which is why
`numprocs > 1` is worth having even at low volume.

**Never** run `queue:restart` and `supervisorctl restart` together; the first
tells workers to exit after the current job, the second kills them.

## 5. systemd equivalents

If the host uses systemd, the equivalent units. The worker command is identical;
the difference is that systemd handles the environment via `EnvironmentFile`
and the scheduler via a timer, which is strictly better than the `while true`
loop.

```ini
# /etc/systemd/system/sekolah-kita-worker@.service
[Unit]
Description=Sekolah Kita queue worker %i
After=network-online.target redis-server.service mariadb.service
Wants=network-online.target

[Service]
Type=simple
User=www-data
Group=www-data
WorkingDirectory=/var/www/sekolah-kita
EnvironmentFile=/etc/sekolah-kita/worker.env
ExecStart=/usr/bin/php artisan queue:work redis \
    --queue=notifications,media,maintenance \
    --tries=3 --timeout=150 --sleep=1 --memory=128 --max-jobs=1000 --max-time=3600
Restart=always
RestartSec=5
# Must exceed the job timeout so a graceful stop can finish the current job.
TimeoutStopSec=180
KillMode=mixed
StandardOutput=append:/var/log/sekolah-kita-worker.log
StandardError=inherit

[Install]
WantedBy=multi-user.target
```

```bash
sudo systemctl daemon-reload
sudo systemctl enable --now sekolah-kita-worker@1.service sekolah-kita-worker@2.service
```

```ini
# /etc/systemd/system/sekolah-kita-scheduler.service
[Service]
Type=oneshot
User=www-data
WorkingDirectory=/var/www/sekolah-kita
EnvironmentFile=/etc/sekolah-kita/worker.env
ExecStart=/usr/bin/php artisan schedule:run
```

```ini
# /etc/systemd/system/sekolah-kita-scheduler.timer
[Timer]
OnBootSec=1min
OnUnitActiveSec=1min
AccuracySec=30s
Persistent=true
```

`Persistent=true` is what catches up runs missed while the host was down.
Without it, a reboot during an outage window silently skips every scheduled task
for that period.

## 6. Verification checklist

```text
sudo supervisorctl status
# Expect RUNNING for every program. A worker in FATAL with "Exited too quickly"
# is almost always a configuration error (missing env, bad APP_KEY, wrong path).

# The worker is actually consuming, not idling on a wrong queue name
redis-cli -a "$REDIS_PASSWORD" -n 2 llen queues:notifications
redis-cli -a "$REDIS_PASSWORD" -n 2 llen queues:media
redis-cli -a "$REDIS_PASSWORD" -n 2 llen queues:maintenance

# No job is stranded (reserved but not progressing)
php artisan queue:failed
php artisan tinker --execute 'echo Illuminate\Support\Facades\Queue::size("notifications");'

# Structured failure lines are landing in the log
sudo grep queue.job_failed /var/log/supervisor/sekolah-kita-worker.log | tail

# The scheduler is firing
php artisan tinker --execute 'var_dump(cache()->get("platform:scheduler:last-run"));'
# Must be a recent ISO-8601 timestamp, or the cron/timer is not running.

# Timeout and retry_after agree
php artisan tinker --execute '
  echo config("queue.connections.redis.retry_after"), " > ",
       config("sekolah-kita.queue.worker_timeout_seconds"), PHP_EOL;'
```
