# Nginx — Sekolah Kita production site

**Purpose:** reverse proxy for a single-application PHP-FPM pool on one Ubuntu VPS.
**Placement:** `/etc/nginx/sites-available/sekolah-kita`, symlinked into `sites-enabled`.
**Assumption:** TLS terminates in Nginx on the same host. If a load balancer or
CDN terminates TLS instead, set `TRUSTED_PROXIES` to *its* address range, not
`0.0.0.0/0` — see §7 of this file.

Every value below is a placeholder. Replace `sekolah.example` and the paths, and
size the buffers against the VPS that will actually run this.

---

## 1. Upstream and PHP-FPM

```nginx
upstream sekolah_kita_php {
    # `server unix:/run/php/php8.5-fpm.sock;`
    # Unix sockets avoid a TCP handshake per request. Use the socket path that
    # `php -i | grep 'Unix socket'` reports on this host — the pool template in
    # php-fpm-pool.conf must set listen to the same path.
    server unix:/run/php/php8.5-fpm.sock;

    # Load distribution across FPM children is handled by FPM itself.
    # `keepalive` here would only help if Nginx spoke FastCGI keepalive, which
    # FPM does not reliably support. Do not add it.
}
```

## 2. Rate limiting zones

These are a coarse, connection-level first line. The application's own
per-identity limiters (`login`, `ppdb-submit`, `contact`, …) are the enforcing
layer and run on the `rate_limits` Redis store. Both layers are intentional:
Nginx sheds obvious floods before PHP is involved, the application stops
targeted abuse against a single account.

```nginx
# Login and password reset: strict, because these are the credential paths.
limit_req_zone $binary_remote_addr zone=sk_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sk_ppdb:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=sk_public:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sk_conn:10m;
```

## 3. gzip and buffering

```nginx
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/rss+xml
    application/xml
    image/svg+xml
    text/css
    text/plain
    text/xml;
```

Brotli is **not** configured here. `ngx_brotli` is a third-party module that is
not in the Ubuntu `nginx` package. If the site needs Brotli, install
`libnginx-mod-http-brotli` and add:

```nginx
brotli on;
brotli_static on;
brotli_comp_level 5;
brotli_types application/javascript application/json image/svg+xml text/css;
```

Removing the module is a one-line `apt remove`; that reversibility is the reason
to use the packaged module rather than compiling Nginx from source.

Buffering notes:

- `proxy_buffering` is intentionally left at its default. Public HTML is small
  and cacheable; disabling buffering would tie up a PHP-FPM worker until the
  slow client finishes reading, which is how a handful of slow readers
  exhausts a small worker pool.
- `client_max_body_size` must be **at least** `PPDB_MAX_DOCUMENT_BYTES`, or
  legitimate PPDB uploads are rejected by Nginx before PHP ever sees them.

## 4. Timeouts

```nginx
client_body_timeout 30s;
client_header_timeout 30s;
send_timeout 30s;
keepalive_timeout 65s;
fastcgi_read_timeout 180s;
```

`fastcgi_read_timeout` must be **greater than** `fastcgi_finish_request_timeout`
and comfortably greater than the slowest expected PHP response. The PPDB
document path does synchronous image re-encoding, so the default 60s is too
tight; 180s matches `REDIS_QUEUE_RETRY_AFTER=180` so Nginx does not abandon a
request that the queue contract considers still valid.

Document uploads are *not* served through PHP: they are stored on the private
disk and streamed by a controller. Keep `client_max_body_size` at the
application limit rather than raising it arbitrarily, so oversized files are
rejected cheaply at the edge.

## 5. Server block

```nginx
server {
    listen 80;
    listen [::]:80;
    server_name sekolah.example;

    # ACME challenges must stay on plaintext HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sekolah.example;

    root /var/www/sekolah-kita/public;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/sekolah.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sekolah.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Keep in step with client_max_body_size in php.ini and
    # PPDB_MAX_DOCUMENT_BYTES. 12M leaves headroom above the 10M default.
    client_max_body_size 12M;

    # Security headers. The application also sets these via
    # App\Http\Middleware\SecurityHeaders; HSTS and the frame policy are
    # repeated here so a static-asset hit is protected too, and so a
    # PHP-FPM outage does not drop them.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    server_tokens off;
    client_max_body_size 12M;

    access_log /var/log/nginx/sekolah-kita.access.log;
    error_log  /var/log/nginx/sekolah-kita.error.log warn;

    # ---- Static assets -------------------------------------------------
    # Vite fingerprints filenames, so these are safe to cache immutably.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ---- Health and readiness -----------------------------------------
    # The liveness probe must not be throttled and must not log, so a
    # monitoring system polling it every few seconds does not fill the
    # access log or trip the per-IP limits.
    location = /health {
        access_log off;
        include fastcgi_params;
        fastcgi_pass sekolah_kita_php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    location = /health/ready {
        access_log off;
        include fastcgi_params;
        fastcgi_pass sekolah_kita_php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # ---- Application ---------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;

        include fastcgi_params;
        fastcgi_pass sekolah_kita_php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;

        # PHP-FPM must never serve a directly requested .php file. Serving
        # /index.php as PHP is required; every other .php path 404s above.
        fastcgi_hide_header X-Powered-By;

        # Restrict FastCGI to the document root so a path-traversal attempt
        # cannot be turned into script execution outside the release.
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Dotfiles and the private storage symlink must never be served.
    location ~ /\. { deny all; }

    # Deny direct access to the private media root. Uploads live outside the
    # document root; this is a second line of defence in case a symlink is
    # ever recreated in the wrong place.
    location ^~ /storage/ {
        # storage:link exposes only the public disk. If the application is
        # configured to stream public media through PHP instead, deny this
        # location entirely.
        internal;
    }
}
```

## 6. Access-log fields

The default log format does not record request time, upstream time, or the
request id. Without those, a slow-request investigation has nothing to work
with, and correlating an application error with a client report needs the
correlation id that `AuditLogService` already generates.

```nginx
log_format sekolah_kita '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time" '
                       'rid="$http_X_Request_Id" ua="$http_User_Agent"';
```

Use it with `access_log /var/log/nginx/sekolah-kita.access.log sekolah_kita;`.

Privacy: the format above records the client address. If that is considered
personal data under the school's retention policy, hash it at the edge or
truncate the subnet, and state the retention window in the privacy notice.
Never log request bodies or query strings for the PPDB routes — the access
token travels in the path segment of `/ppdb/status/{token}`.

## 7. Trusted proxies and hosts

This is the section most often gotten wrong, and it was a live defect in this
codebase before Phase 8.

- `TRUSTED_PROXIES` must contain the addresses that *send* the forwarded
  headers. If Nginx is local, that is `127.0.0.1`. If a CDN is in front, that is
  the CDN's published ranges.
- `TRUSTED_HOSTS` must contain the host patterns the application answers to,
  e.g. `^sekolah\.example$`.
- `0.0.0.0/0` or `*` lets any client spoof `X-Forwarded-For`, which defeats
  every per-IP rate limit and every audit-log IP hash. `platform:readiness`
  fails closed on a wildcard, and `PlatformRuntimeGuard` refuses to boot.
- If TLS terminates at a load balancer, the application must trust that proxy
  or `$request->isSecure()` will be `false` in production while the browser is
  on HTTPS. The symptom is session cookies that are never marked secure, or a
  redirect loop on `https://`.

## 8. Verification checklist

Run after every Nginx change, on the server, not locally:

```text
sudo nginx -t
sudo systemctl reload nginx
curl -sI https://sekolah.example/                       # 200, HSTS present
curl -sI https://sekolah.example/build/manifest.json    # Cache-Control immutable
curl -s  https://sekolah.example/health                 # {"status":"ok"}
curl -s  https://sekolah.example/health/ready           # 200 when dependencies are up
curl -sI https://sekolah.example/.env                    # 403 or 404, never 200
curl -sI https://sekolah.example/storage/               # 403 or 404, never 200
curl -sI -H "X-Forwarded-For: 203.0.113.9" \
     https://sekolah.example/login                      # 429 after the limit is hit
```

The last check is the one that proves `TRUSTED_PROXIES` is live: if the rate
limiter keys on the real client address, exceeding the limit from one source
does not lock out every other user.
