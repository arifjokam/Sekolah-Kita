# PHP-FPM pool — Sekolah Kita

**Purpose:** sizing methodology and a template for `/etc/php/8.5/fpm/pool.d/sekolah-kita.conf`.
**Status:** template with placeholders. `pm.max_children` below is a worked
example for one specific VPS shape, not a recommendation. Read §2 before using
it on hardware that is not that shape.

---

## 1. What this application spends time on

Worker sizing follows from the request mix, not from a round number. For this
codebase the relevant facts are:

| Request class | PHP work | Dominant cost |
| --- | --- | --- |
| Public home, news, gallery, teachers, school profile | Served from the bounded public-content cache; on a hit, no domain queries at all | Blade render, ~5–15 ms |
| Public page on a cache miss | Several indexed MariaDB queries plus Blade | 20–80 ms |
| PPDB list, status, document upload | Transactional writes, image re-encoding on upload | 50–800 ms |
| Authenticated dashboard, notifications | Session read, small indexed reads | 10–40 ms |
| Admin CRUD, PPDB review | Writes, audit logging, policy checks | 20–120 ms |

The consequence that matters: **peak concurrency is not uniform across
endpoints.** A 1000-user surge of cached public reads is a cheap workload; a
smaller number of simultaneous document uploads will saturate the pool far
sooner, because image re-encoding is 50–100× a cache hit.

Size the pool for the *read* target, and treat upload concurrency as a separate,
smaller budget — see §5.

## 2. Sizing methodology

Two independent constraints. The pool must satisfy both.

### 2.1 CPU bound (the usual constraint)

`pm.max_children` is approximately:

```
max_children ≈ (total_vCPU_cores × target_CPU_utilisation) / average_CPU_per_request
```

A target of 0.6–0.7 is deliberate: at 1.0 the scheduler is saturated, tail
latency collapses, and requests queue *inside* PHP where they cannot be shed.
PHP is CPU-bound under a cached-read workload; leave headroom for the GC, the
opcache compiler, and MariaDB's own work on the same cores.

Worked example, 4 vCPU / 8 GB VPS, 15 ms average cached read:

```
4 × 0.65 = 2.6 effective cores
2.6 / 0.015 = ~173
```

Clamp by memory (§2.2) — memory is the binding constraint far more often, which
is why the example pool below lands on 12 rather than 173.

### 2.2 Memory bound (usually the real constraint)

```
max_children ≈ (RAM_MB × memory_headroom_fraction) / (memory_limit_MB × 1.15)
```

The `1.15` accounts for the FPM master, the CLI workers used by the scheduler
and queue processes, and per-process overhead beyond `memory_limit`. Use
`memory_headroom_fraction` of **0.25–0.35** on a host that also runs MariaDB and
Redis — those need the rest.

Worked example, 8 GB total, `memory_limit=256M`, 30% headroom:

```
8192 × 0.30 = 2457 MB available to FPM
2457 / (256 × 1.15) = ~8.3  →  max_children = 8
```

An 8 GB VPS that also hosts MariaDB and Redis is a *small* server for 500–1000
concurrent users. Be honest about that in §6 rather than raising `memory_limit`
to make the arithmetic look better. Raising `memory_limit` to fit more workers
converts a memory problem into an out-of-memory kill, which is worse: the
master process dies and every in-flight request is dropped at once.

### 2.3 Connection count

```
max_children × (pool_size + scheduler + workers + admin shell) ≤ max_connections − headroom
```

`pool_size` is a *ceiling on concurrent statements per request*, not a
guarantee; a typical request opens 1–3 connections. With `pool_size=5` and 10
children the honest worst case is 50 MariaDB connections, not 10. Size
`max_connections` from this number plus the queue workers plus 20% spare — see
`mariadb-production.cnf` for how to set it.

## 3. Pool template

```ini
[sekolah-kita]
user = www-data
group = www-data

; Must match the `upstream` block in nginx.conf.
listen = /run/php/php8.5-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
listen.backlog = 511

; ---- Derived from §2.2 for 8 GB / 256M. Recompute for the real host. ----
pm = dynamic
pm.max_children = 12
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 6
pm.max_requests = 500

; Bound the blast radius of a single slow request on a worker.
request_terminate_timeout = 180s

; --- Rejected outright: a runaway script must not occupy a worker forever. ---
request_slowlog_timeout = 5s
slowlog = /var/log/php/sekolah-kita-slow.log

php_admin_value[error_log] = /var/log/php/sekolah-kita-error.log
php_admin_flag[log_errors] = on

; The application reports errors; PHP must not also print them into the
; response body, which would corrupt JSON API responses and leak paths.
php_admin_flag[display_errors] = off
php_admin_flag[expose_php] = off

; Errors are logged, not rendered inline. Never enable display_errors in
; production: a stack trace is a disclosure vulnerability.
catch_workers_output = yes
decorate_workers_output = no

clear_env = no

; --- Environment. Secrets come from the host, not from this file. ---
env[APP_ENV] = production
env[APP_DEBUG] = false

php_value[memory_limit] = 256M
php_value[max_execution_time] = 180
php_value[upload_max_filesize] = 12M
php_value[post_max_size] = 14M
php_value[max_file_uploads] = 5
```

## 4. Why these directives

**`pm = dynamic`, not `static`.** `static` allocates every worker up front —
best for a fixed, cheap workload, worst for a spiky one, because a burst finds
all children already busy. `dynamic` scales between `min_spare_servers` and
`pm.max_children` and reaps idle workers.

**`pm.max_requests = 500`.** Recycles a worker after 500 requests. This is the
single most effective defence against memory leaks that grow per request. It
costs a fork every few hundred requests, which is negligible. Do not set it to
0 ("unlimited") on a long-lived server.

**`pm.start_servers` / `min_spare_servers`.** Warm workers absorb the burst that
arrives when a deployment or a social-media link puts load on the site at once.
4 is a reasonable floor for this request mix; the exact value depends on how
fast the host can fork a PHP process.

**`request_terminate_timeout`.** Must be **at least** the slowest legitimate
request, and must be **less than** `fastcgi_read_timeout` in Nginx, or Nginx
hangs up while PHP is still working. 180s matches the Nginx value and
`REDIS_QUEUE_RETRY_AFTER=180`.

**`request_slowlog_timeout = 5s`.** Anything over 5s on this application is
abnormal and worth a stack trace. This is a diagnostic aid, not a limit.

**`clear_env = no`.** Required. With the default `clear_env = yes`, FPM strips
`$_ENV`/`getenv()` values and the application's `env()`-driven configuration
silently falls back to defaults — the classic "works on the CLI, wrong in the
web" failure. Because the application reads configuration from cached config in
production (`php artisan optimize`), prefer the `env[...]` lines above plus
`config:cache`; but `clear_env = no` must stay either way.

## 5. Upload concurrency

Document upload performs synchronous image re-encoding (`PrivateDocumentService`).
That is memory-hungry and CPU-hungry, and one 6000×6000 image can consume
`max_execution_time` worth of a worker.

- Keep `client_max_body_size`, `upload_max_filesize`, and
  `PPDB_MAX_DOCUMENT_BYTES` in step. The smallest of the three is what
  actually applies, so a mismatch shows up as an unexplained rejection.
- `post_max_size` must exceed `upload_max_filesize`; otherwise PHP discards
  the whole POST when the total exceeds it.
- On a 4 vCPU host, consider moving PPDB document processing fully to the
  `media` queue so the web request only stores bytes and returns. The
  quarantine model already supports this — the upload is marked
  `Quarantined`/`Pending` and released by `ProcessAdmissionDocument`.
- Do **not** raise `memory_limit` to accommodate large images. A 20 MP image at
  ~8 bytes/pixel in an `imagecreatetruecolor` canvas is roughly 160 MB, before
  the source decode. `PrivateDocumentService` caps dimensions at 6000×6000 and
  20 MP for this reason — keep that cap.

## 6. Honest capacity note

12 children on 4 vCPU is a **small** pool. A small pool is correct for a small
VPS; it does not deliver 500–1000 concurrent users.

The arithmetic that matters: at 15 ms average, 12 busy workers serve roughly
`12 / 0.015` = **800 requests/second** *if they never go idle*. Sustainable
throughput on real traffic is far lower — 100–300 rps is realistic — because
requests are not uniformly distributed and there is always a cache miss, a
slow query, or a burst.

Concurrent users and throughput are different quantities. 1000 users reading
cached pages at a human rate (~1 request every 5 s) is 200 rps — comfortably
inside that range. 1000 users each firing requests simultaneously is a
different problem, and one Nginx + one FPM pool on one 4 vCPU VPS will not
absorb it.

This is why the sizing method is written down instead of a number: the number
depends on the VPS that actually gets provisioned, and it must be re-derived
from §2 after a load test against that host. See `docs/LOAD_TEST_PLAN.md` and
`docs/PRODUCTION_CAPACITY_GUIDE.md`.

## 7. Verification checklist

```text
# Pool is live with the intended size
sudo systemctl restart php8.5-fpm
ps -o pid,ppid,rss,cmd -C php-fpm | head -20

# Memory stays bounded under sustained load (this is the leak check)
watch -n 5 'ps -o rss= -C php-fpm | awk "{s+=\$1} END {print s/1024 \" MB\"}"'

# Children recycle rather than accumulate
grep -c "exiting" /var/log/php/sekolah-kita-error.log

# Slow requests are being captured
sudo tail -f /var/log/php/sekolah-kita-slow.log

# A runaway request is killed, not left to hold a worker
# (expect a 502 from Nginx after request_terminate_timeout)
curl -m 300 -sI https://sekolah.example/does-not-exist-slowly
```
