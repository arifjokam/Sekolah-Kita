# Redis — Sekolah Kita production configuration

**Purpose:** the intended production backend for cache, sessions, queue, rate
limiting, and distributed locks.
**Placement:** `/etc/redis/redis.conf` (edit) or a drop-in
`/etc/redis/redis.conf.d/sekolah-kita.conf`.

---

## 0. What Redis is and is not for here

Redis holds **no business truth** in this system. It holds:

- rendered public-content cache projections (disposable — the warmer rebuilds them),
- server-side session payloads (disposable — users re-authenticate),
- queue payloads (disposable *only* because every job is safe to re-run; see §6),
- rate-limit counters and short-lived locks (disposable).

MariaDB is the source of truth. If Redis is lost, the correct recovery is to
rebuild it, not to restore it — with one exception worth stating plainly:
**in-flight queue payloads are lost on a Redis restart unless persistence is
enabled.** For PPDB document processing, that means an uploaded document stays
`Quarantined`/`Pending` and is never released. It is not data loss, but it is
visible to staff, so either enable AOF/RDB or add a reconciliation job.

## 1. The PHP client

`php8.5-redis` is the phpredis extension. **It depends on `php8.5-igbinary`** —
installing the extension alone produces a `undefined symbol: igbinary_serialize`
startup error on every request, including web requests, because the failure
happens at extension load, not at first use.

```bash
sudo apt-get install -y php8.5-redis php8.5-igbinary
php -m | grep -E '^(redis|igbinary)$'
php --ri redis | head -5
```

Verify the extension is a real socket client and not a stub:

```bash
php -r '$r = new Redis(); $r->connect("127.0.0.1", 6379, 2.0);
        var_dump($r->ping());'
```

`REDIS_CLIENT=predis` is also supported by the configuration and would remove
the extension dependency, at the cost of lower throughput. Do not switch to it
under load to "fix" an extension problem; install the extension.

## 2. Network and authentication

```conf
# Bind to loopback only. The application is on the same host.
bind 127.0.0.1 -::1
port 6379

protected-mode yes

# Never run Redis unauthenticated on any interface.
requirepass <generated-64-byte-secret>
rename-command FLUSHALL ""
rename-command FLUSHDB  ""
rename-command CONFIG   ""
rename-command DEBUG    ""
```

- Do **not** expose Redis to a network. There is no TLS in the default build
  and no per-command authorisation. Use a private network with a firewall if it
  must be remote, and add `tls-port` / `tls-cert-file` only on a build that
  supports it.
- Put the password in the secret store and inject `REDIS_PASSWORD` from there.
  Never commit it. `REDIS_REQUIRED_IN_PRODUCTION=true` (the default) makes the
  application refuse to boot in production if Redis is unreachable, so a
  missing or wrong password is a loud failure, not a silent fallback.
- The `rename-command` entries above mean `CONFIG SET` and `FLUSHALL` are not
  available to the application. That is intentional: the application never needs
  them, and removing them limits the blast radius of an application-level
  injection bug. Be aware that some monitoring tools require `CONFIG`; grant it
  via a separate, ACL-scoped user rather than by removing the rename.

## 3. Memory and eviction

```conf
# Set to a fraction of RAM that Redis may use, and only after reserving memory
# for MariaDB, PHP-FPM, and the OS page cache. 60% is a reasonable ceiling on a
# dedicated host; on a shared 4 GB VPS, compute it rather than copying a number.
maxmemory 1.5gb

# Cache and session data are both reconstructible. Rate-limit counters are not
# reconstructible, but evicting them only resets a throttle, which fails open
# for a short window — an acceptable trade against an OOM kill that takes down
# cache, sessions, and the queue simultaneously.
maxmemory-policy volatile-lru
```

`volatile-lru` evicts only keys that already have a TTL. This matters: the
session registry, cache entries, and limiter counters all carry TTLs, while a
key without one is treated as persistent and protected. If you see Redis memory
climbing with nothing expiring, something is writing keys without a TTL — that
is an application bug, and it will not be relieved by an eviction policy.

`allkeys-lru` is a reasonable alternative for a cache-only instance, but this
instance also carries the queue, so `volatile-lru` is the safer default.

Alert on `used_memory` above 80% of `maxmemory` and on any increase in
`evicted_keys`. A non-zero `evicted_keys` on the session connection means
users are being logged out under load.

## 4. Persistence

```conf
# AOF with everysec: at most one second of writes lost on a hard kill. This is
# what preserves in-flight queue payloads. Enable it unless the queue is
# genuinely discardable.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# RDB as a cheaper full snapshot, used for a warm restart.
save 900 1
save 300 10
save 60 10000

# Queue payloads are short-lived; an RDB older than an hour is not worth
# restoring. Keep a small window.
rdbcompression yes
rdbchecksum yes
```

Trade-off to state explicitly: `everysec` can lose up to one second of writes.
For a school system that means, worst case, re-sending one email or losing one
queued document-processing job — acceptable. Set `appendfsync always` only if a
hard power loss must not lose anything, and measure the fsync latency cost
before choosing it.

## 5. Logical database separation

The application already isolates concerns by logical database:

| Concern | Connection | Default DB |
| --- | --- | --- |
| Sessions | `default` | 0 |
| Cache | `cache` | 1 |
| Queue | `queue` | 2 |
| Rate limiting | `rate_limits` | 3 |

```conf
databases 16
```

Logical databases are **not** a security boundary. They are an operational
convenience: a `FLUSHDB` on the cache connection cannot take out the queue, and
a runaway cache cannot exhaust the memory the queue needs. For real isolation
(separate credentials, separate memory limits, separate failure domains), use
separate instances. The architecture decision D-009 requires separate
configured connections and prefixes, which the logical split satisfies for a
single-node deployment; it explicitly does not claim to satisfy true isolation.

## 6. Keyspace notifications

Not required. The application expires keys with explicit TTLs, so passive
expiry is adequate and `lazyfree-lazy-expire` keeps the main thread responsive:

```conf
lazyfree-lazy-expire yes
lazyfree-lazy-eviction yes
lazyfree-lazy-server-del yes
```

## 7. Slowlog and latency

```conf
slowlog-log-slower-than 10000
slowlog-max-len 256
latency-monitor-threshold 100
```

Anything slower than 10 ms on a loopback connection is anomalous and points at
CPU starvation or a large `KEYS`/`SCAN` pattern in application code.

## 8. Verification checklist

```text
# Authenticated reachability, as the application sees it
redis-cli -a "$REDIS_PASSWORD" ping

# Each configured connection answers, and they are genuinely separate
for db in 0 1 2 3; do
  echo "db$db: $(redis-cli -a "$REDIS_PASSWORD" -n $db dbsize)"
done

# The application's own view
php artisan platform:readiness | sed -n '/^redis/,/^$/p'

# No unsafe commands are reachable
redis-cli -a "$REDIS_PASSWORD" config get maxmemory-policy
redis-cli -a "$REDIS_PASSWORD" --no-auth-warning flushall   # expect an error

# Persistence is actually on
redis-cli -a "$REDIS_PASSWORD" config get appendonly
redis-cli -a "$REDIS_PASSWORD" info persistence | grep -E "aof_enabled|aof_last_write_status|rdb_last_bgsave_status"

# No TTL-less keys are accumulating in the cache connection
redis-cli -a "$REDIS_PASSWORD" -n 1 --scan --pattern '*' | head -50 \
  | while read -r k; do
      t=$(redis-cli -a "$REDIS_PASSWORD" -n 1 ttl "$k")
      [ "$t" = "-1" ] && echo "PERSISTENT KEY: $k"
    done

# Memory and eviction counters
redis-cli -a "$REDIS_PASSWORD" info memory | grep -E "used_memory_human|maxmemory_human"
redis-cli -a "$REDIS_PASSWORD" info stats | grep evicted_keys
```

## 9. Redis and the readiness gate

`platform:readiness` checks the `phpredis` extension, the `REDIS_PREFIX`, and a
`PING` against every configured connection. `PlatformRuntimeGuard` refuses to
boot a production release whose Redis client is missing or whose cache, session,
or queue store has fallen back to the database driver.

That is deliberate. The architecture decision record states that Redis failure
must not silently degrade to a database session or rate-limit store. A silent
fallback under load is how a Redis incident becomes a database outage, because
the database inherits the cache and session workload it was never sized for.
