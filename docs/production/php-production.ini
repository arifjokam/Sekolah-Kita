# PHP-FPM / OPcache — Sekolah Kita production php.ini

**Placement:** these belong in the pool file (`php-fpm-pool.conf`) or
`/etc/php/8.5/fpm/conf.d/99-sekolah-kita.ini`, not in a hand-edited
`php.ini`, so a distro upgrade does not silently discard them.

> **Important:** OPcache is **not** shared between the FPM pool and the CLI.
> The queue workers and the scheduler run under `php-cli` and get their own
> OPcache instance with its own memory budget. Budget for that separately
> (§4). A tuned FPM OPcache does nothing for the workers.

---

## 1. OPcache

```ini
opcache.enable = 1
opcache.enable_cli = 0

; Compile once, reuse until the file changes.
; "timestamp" revalidates by mtime on each request: cheap, and it means a
; `config:cache` or a code deploy takes effect without a manual reset.
; "validate_timestamps=0" is faster but makes every deploy require an
; explicit opcache_reset; it is a footgun on a server where operators
; forget. Keep 1.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

; Steady-state working set. 192M comfortably holds a Laravel 13 application
; with views plus the cached config/routes/events classes. Watch
; `memory_consumption`; raise only if it approaches the cap.
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16

; Bound how many scripts may be in the cache at all, so a runaway process
; cannot evict everything else.
opcache.max_accelerated_files = 20000
opcache.max_wasted_percentage = 10

; Each cached script file consumes an inode-style entry. A mismatch shows
; up as "Cannot allocate memory" or an unexplained restart loop.
opcache.file_cache = /var/cache/php/opcache

; Jump straight to errors. A full error log for a 1000-rps site is its own
; outage risk; triage from the application's structured log instead.
opcache.jit = disable
opcache.jit_buffer_size = 0

opcache.save_comments = 1
opcache.validate_permission = 1
opcache.huge_code_pages = 0
```

`opcache.jit` is deliberately **disabled**. JIT helps long-running CPU-bound
processes; for request-per-process FPM the compile-time gain is small, and JIT
has historically caused hard-to-diagnose issues with extensions and with
reference-counting bugs. Revalidate this choice if the workload ever shifts
toward heavy computation — it should not be flipped without measurement.

## 2. Resource limits

```ini
; Must match the pool and Nginx values. The smallest limit in the chain wins.
memory_limit = 256M
max_execution_time = 180
max_input_time = 180
post_max_size = 14M
upload_max_filesize = 12M
max_file_uploads = 5
default_socket_timeout = 30

; Guard rails against a single request consuming the host.
max_input_vars = 1000
max_input_time = 180
```

Raise `memory_limit` only with a reason. The worker sizing in
`php-fpm-pool.conf` §2.2 is derived *from* this value, so raising it silently
reduces the safe worker count. Re-derive §2.2 if you change it.

## 3. Security and information disclosure

```ini
; Errors go to the log, never into the response body. A stack trace rendered
; into a response is a disclosure vulnerability: it leaks absolute paths,
; vendor versions, and occasionally configuration values.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Deprecations are noise on a stable release; keep them out of the error
; log so real errors are visible.
expose_php = Off

; Never enable this in production. It is the single most dangerous ini
; directive here: it exposes every error detail, including file paths and
; query fragments, to any visitor.
; html_errors = Off

; Sessions. Redis is the production driver; these govern the file/array
; fallbacks and PHP's own session machinery.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.gc_maxlifetime = 7200
session.sid_length = 48
session.sid_bits_per_character = 5

; Real-user IP is taken from the framework's trusted-proxy list, not from
; this. Listed only so the value is not left at an unsafe default.
; real_ip_header = X-Forwarded-For

; cURL is used by the mail and HTTP transports.
allow_url_fopen = On
allow_url_include = Off

date.timezone = Asia/Jakarta
```

## 4. CLI budget (queue workers and the scheduler)

Workers do not share FPM's OPcache. On a small host, the CLI OPcache is a
second slice of memory for the same application:

```ini
; In the CLI php.ini / conf.d, if the workers are memory constrained.
opcache.enable_cli = 0
```

With `opcache.enable_cli = 0`, each worker recompiles on start. That costs a
fraction of a second per worker restart and removes a real memory problem, and
it is the right trade for a handful of long-lived workers. Turn CLI OPcache on
only when the host has RAM to spare and the worker start time is being
measured as significant.

Worker memory is additionally bounded by `--memory=128M` on
`php artisan queue:work` (see `supervisor-queue.conf`), which makes a
runaway job fail loudly instead of being OOM-killed with no trace.

## 5. Verification checklist

```text
php -i | grep -E "opcache.enable|memory_limit|upload_max|post_max|expose_php"
php -r 'var_dump(ini_get("opcache.enable"), ini_get("memory_limit"));'

# OPcache is actually retaining the application (these are the files that matter)
curl -s https://sekolah.example/ >/dev/null
php -r '$s=opcache_get_status(false); echo "enabled=",(int)$s["opcache_enabled"]
  ." cached=".count($s["scripts"]??[])." used=".round($s["memory_usage"]["used_memory"]/1048576)."MB"
  ." free=".round($s["memory_usage"]["free_memory"]/1048576)."MB".PHP_EOL;'

# Errors are logged, not rendered
curl -s https://sekolah.example/this-does-not-exist | grep -ci "stack trace"   # expect 0

# The pool did not pick up a stale php.ini
sudo php-fpm8.5 -tt | grep -A2 "php_admin_value\|php_value"
```
